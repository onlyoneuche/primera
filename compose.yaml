services:
  dev:
    build:
      context: .
      target: development
    profiles: [tools]
    volumes:
      - .:/workspace
    environment:
      MPLCONFIGDIR: /tmp/primera-matplotlib
      NUMBA_CACHE_DIR: /tmp/primera-numba
    init: true
  web:
    build:
      context: .
      target: runtime
    ports:
      - "127.0.0.1:${PORT:-8000}:8000"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    init: true
